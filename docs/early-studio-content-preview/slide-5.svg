width="456" height="49" rx="10" fill="#FFFFFF" stroke="#E1DCD0"/><text x="59" y="497.92" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3526F5">03</text><text x="95" y="498.6" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1B18">If neither, when should we revisit it?</text><rect x="42" y="549" width="456" height="49" rx="10" fill="#F2AE24" stroke="#F2AE24"/><text x="62" y="577.6" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1B18">Bring that list to your scoping conversation.</text><line x1="42" y1="623" x2="498" y2="623" stroke="#E1DCD0" stroke-width="1"/><text x="42" y="645.72" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#66655E">Independent proposed draft by KOOM - not commissioned</text><text x="42" y="657.3" font-family="Arial, sans-serif" font-size="7.5" font-weight="400" fill="#66655E">AI-assisted. Illustrative product example. Client approval required.</text></svg>