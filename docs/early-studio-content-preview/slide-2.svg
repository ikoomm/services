<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 540 675"><rect x="0" y="0" width="540" height="675" rx="0" fill="#FBF7EE" stroke="#FBF7EE"/><text x="42" y="43.08" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1B1B18">Proposed for Early</text><text x="42" y="59.72" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#66655E">SOFTWARE STUDIO / PRODUCT NOTES</text><text x="458" y="45.24" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#66655E">02 / 05</text><line x1="42" y1="79" x2="498" y2="79" stroke="#E1DCD0" stroke-width="1"/><text x="42" y="109.4" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#3526F5">STEP 01 / DEFINE THE OUTCOME</text><text x="42" y="169.92" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1B1B18">Write down</text><text x="42" y="212.92" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1B1B18">the task.</text><text x="42" y="262.96" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#1B1B18">For a booking product, the first flow might look like</text><text x="42" y="288.60999999999996" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#1B1B18">this:</text><rect x="42" y="329" width="456" height="70" rx="12" fill="#FFFFFF" stroke="#E1DCD0"/><rect x="58" y="347" width="34" height="34" rx="17" fill="#3526F5" stroke="#3526F5"/><text x="70" y="367.6" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text><text x="109" y="359.12" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B1B18">Choose a time</text><text x="109" y="380.92" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#66655E">See what is actually available.</text><rect x="42" y="411" width="456" height="70" rx="12" fill="#FFFFFF" stroke="#E1DCD0"/><rect x="58" y="429" width="34" height="34" rx="17" fill="#3526F5" stroke="#3526F5"/><text x="70" y="449.6" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text><text x="109" y="441.12" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B1B18">Reserve it</text><text x="109" y="462.92" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#66655E">Save the selected slot.</text><rect x="42" y="493" width="456" height="70" rx="12" fill="#FFFFFF" stroke="#E1DCD0"/><rect x="58" y="511" width="34" height="34" rx="17" fill="#3526F5" stroke="#3526F5"/><text x="70" y="531.6" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text><text x="109" y="523.12" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B1B18">Get confirmation</text><text x="109" y="544.92" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#66655E">Know the booking is complete.</text><text x="42" y="598.6" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1B18">Now you have something specific to scope.</text><line x1="42" y1="623" x2="498" y2="623" stroke="#E1DCD0" stroke-width="1"/><text x="42" y="645.72" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#66655E">Independent proposed draft by KOOM - not commissioned</text><text x="42" y="657.3" font-family="Arial, sans-serif" font-size="7.5" font-weight="400" fill="#66655E">AI-assisted. Illustrative product example. Client approval required.</text></svg>